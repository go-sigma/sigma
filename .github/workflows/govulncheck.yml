# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Govulncheck CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  # Required checks have to run again for every merge queue entry.
  merge_group:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        go: ["1.27"]
    steps:
      # Android, .NET and Haskell tooling ship with the runner and nothing here
      # uses them; dropping them keeps docker builds and go test away from the
      # disk limits of the hosted runners.
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      # setup-go caches GOMODCACHE and GOCACHE, which is what `go tool
      # govulncheck` needs to avoid recompiling the module graph every run.
      - name: Setup golang
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Download go modules
        run: go mod download
      # govulncheck is pinned as a tool in go.mod (golang.org/x/vuln/cmd/govulncheck).
      # The project build tags are required so every package compiles on a clean runner.
      # The report is always written to the job summary. The step is non-blocking
      # (continue-on-error) so findings are reported without failing the workflow.
      - name: Run govulncheck
        continue-on-error: true
        run: |
          set +e
          go tool govulncheck \
            -tags "netgo,timetzdata,exclude_graphdriver_btrfs,containers_image_openpgp" \
            ./... > govulncheck.txt 2>&1
          status=$?
          set -e

          {
            echo "## Govulncheck"
            echo ""
            if [ "${status}" -eq 0 ]; then
              echo "No known reachable vulnerabilities found."
            else
              echo "govulncheck exited with status ${status}. See the report below."
            fi
            echo ""
            echo '```text'
            cat govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${status}"
