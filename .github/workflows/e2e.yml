# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: E2E CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  # Required checks have to run again for every merge queue entry.
  merge_group:

jobs:
  e2e-test:
    name: e2e-test
    runs-on: ubuntu-26.04
    steps:
      # Android, .NET and Haskell tooling ship with the runner and nothing here
      # uses them; dropping them keeps docker builds and go test away from the
      # disk limits of the hosted runners.
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      # Also caches the modules skopeo pulls in below: setup-go saves whatever
      # ends up in GOMODCACHE/GOCACHE when the job finishes.
      - name: Setup golang
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Build latest skopeo
        run: |
          git clone --depth 1 --branch v1.24.1 https://github.com/containers/skopeo.git
          cd skopeo
          DISABLE_CGO=1 make bin/skopeo
          sudo cp ./bin/skopeo /usr/bin/skopeo
          cd ..
          rm -rf skopeo
          skopeo --version
      - name: Allow the local registry without TLS
        run: |
          IP=`hostname -I | awk '{print $1}'`
          echo '{"insecure-registries" : ["'$IP':3000"]}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build sigma-server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          target: sigma-server
          platforms: linux/amd64
          load: true
          tags: sigma:latest
          # Reuse the cache image-build.yml exports to GHCR. The packages are
          # public, so it is read anonymously; e2e never writes the cache because
          # both workflows run on the same push event and a second exporter would
          # race with image-build.
          cache-from: type=registry,ref=ghcr.io/go-sigma/sigma:buildcache-amd64
          provenance: false
          sbom: false
      - name: Run sigma
        run: |
          docker run --name sigma -v /var/run/docker.sock:/var/run/docker.sock -d -p 3000:3000 sigma:latest
          sleep 5
          docker logs sigma
      - name: Test push and e2e with k6
        run: |
          ./e2e/push.sh
          curl https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz -L | tar xvz --strip-components 1
          ./k6 run -e SIGMA_ADMIN_PASSWORD="$SIGMA_ADMIN_PASSWORD" e2e/sc.js
          docker logs sigma
