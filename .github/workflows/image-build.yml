# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Image CI

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
  # Required checks have to run again for every merge queue entry.
  merge_group:

jobs:
  image-build:
    name: image-build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      # Android, .NET and Haskell tooling ship with the runner and nothing here
      # uses them; dropping them keeps docker builds and go test away from the
      # disk limits of the hosted runners.
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: tosone
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build sigma-server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          target: sigma-server
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/go-sigma/sigma:${{ github.ref_type == 'tag' && format('{0}-{1}', github.ref_name, matrix.arch) || format('nightly-{0}', matrix.arch) }}
          provenance: false
          sbom: false
          outputs: "${{ github.event_name == 'push' && 'type=registry,force-compression=true,oci-mediatypes=true' || '' }}"
      - name: Build sigma-builder
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          target: sigma-builder
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/go-sigma/sigma-builder:${{ github.ref_type == 'tag' && format('{0}-{1}', github.ref_name, matrix.arch) || format('nightly-{0}', matrix.arch) }}
          provenance: false
          sbom: false
          outputs: "${{ github.event_name == 'push' && 'type=registry,force-compression=true,oci-mediatypes=true' || '' }}"
  merge-multi-arch:
    name: merge-multi-arch
    runs-on: ubuntu-24.04
    needs: [image-build]
    if: github.event_name == 'push'
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: tosone
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Create and push multi-arch manifest for sigma
        run: |
          docker buildx imagetools create \
            -t ghcr.io/go-sigma/sigma:${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }} \
            ghcr.io/go-sigma/sigma:${{ github.ref_type == 'tag' && format('{0}-amd64', github.ref_name) || 'nightly-amd64' }} \
            ghcr.io/go-sigma/sigma:${{ github.ref_type == 'tag' && format('{0}-arm64', github.ref_name) || 'nightly-arm64' }}
      - name: Create and push multi-arch manifest for sigma-builder
        run: |
          docker buildx imagetools create \
            -t ghcr.io/go-sigma/sigma-builder:${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }} \
            ghcr.io/go-sigma/sigma-builder:${{ github.ref_type == 'tag' && format('{0}-amd64', github.ref_name) || 'nightly-amd64' }} \
            ghcr.io/go-sigma/sigma-builder:${{ github.ref_type == 'tag' && format('{0}-arm64', github.ref_name) || 'nightly-arm64' }}
