name: Image CI

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - gh-readonly-queue/main/*
      - release-*
    tags:
      - "v*"
  pull_request:
    branches:
      - dev

jobs:
  image-build-amd64:
    name: image-build-amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: tosone
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push
        shell: bash
        run: |
          docker buildx bake --file ./build/docker-bake.hcl \
            --set "sigma-server.output=type=registry,name=ghcr.io/go-sigma/sigma:nightly-amd64,force-compression=true,oci-mediatypes=true" \
            --set "sigma-builder.output=type=registry,name=ghcr.io/go-sigma/sigma-builder:nightly-amd64,force-compression=true,oci-mediatypes=true" \
            --set "base.args.WITH_TRIVY_DB=true" --set "*.platform=linux/amd64" \
            --provenance false --sbom false sigma-server sigma-builder
  image-build-arm64:
    name: image-build-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Delete huge unnecessary folders, and clean apt cache
        shell: bash
        run: |
          rm -rf /opt/hostedtoolcache
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: tosone
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push
        shell: bash
        run: |
          docker buildx bake --file ./build/docker-bake.hcl \
            --set "sigma-server.output=type=registry,name=ghcr.io/go-sigma/sigma:nightly-arm64,force-compression=true,oci-mediatypes=true" \
            --set "sigma-builder.output=type=registry,name=ghcr.io/go-sigma/sigma-builder:nightly-arm64,force-compression=true,oci-mediatypes=true" \
            --set "base.args.WITH_TRIVY_DB=true" --set "*.platform=linux/arm64" \
            --provenance false --sbom false sigma-server sigma-builder
  merge-multi-arch:
    name: merge-multi-arch
    runs-on: ubuntu-24.04
    needs: [image-build-amd64, image-build-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: tosone
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tosone
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Create and push multi-arch manifest for sigma
        run: |
          docker buildx imagetools create \
            -t ghcr.io/go-sigma/sigma:nightly \
            ghcr.io/go-sigma/sigma:nightly-amd64 \
            ghcr.io/go-sigma/sigma:nightly-arm64
      - name: Create and push multi-arch manifest for sigma-builder
        run: |
          docker buildx imagetools create \
            -t ghcr.io/go-sigma/sigma-builder:nightly \
            ghcr.io/go-sigma/sigma-builder:nightly-amd64 \
            ghcr.io/go-sigma/sigma-builder:nightly-arm64
