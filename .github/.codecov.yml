# yaml-language-server: $schema=https://www.schemastore.org/codecov.json
coverage:
  precision: 2
  round: down
  range: "30...100"
  status:
    patch:
      default:
        threshold: 4%
    project:
      default:
        threshold: 4%
ignore:
  - "./main.go"
  - "./web/"
  - "./cmd/"
  - "./pkg/cmds/"
  - "./pkg/tests/"
