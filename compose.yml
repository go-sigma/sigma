services:
  sigma:
    container_name: sigma
    image: ghcr.io/go-sigma/sigma:nightly
    ports:
      - "3000:3000"
    command: ["sigma", "server", "-c", "/etc/sigma/config-compose.yaml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/conf:/etc/sigma
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rs3:
        condition: service_healthy
    networks:
      - default
  postgresql:
    container_name: postgresql
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: sigma
      POSTGRES_USER: sigma
      POSTGRES_DB: sigma
    volumes:
      - ${PWD}/storage/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigma -d sigma || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
  redis:
    container_name: redis
    image: redis:8.0-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass sigma
    volumes:
      - ${PWD}/storage/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sigma", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
  rs3:
    container_name: rs3
    image: ghcr.io/go-sigma/rs3:nightly
    ports:
      - "9000:9000"
    environment:
      RS3_HOST: 0.0.0.0
      RS3_PORT: 9000
      RS3_DATA_DIR: /var/lib/rs3/data
      RS3_ACCESS_KEY: sigma
      RS3_SECRET_KEY: sigma-sigma
      RS3_ENDPOINT: http://127.0.0.1:9000
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /var/lib/rs3/data/sigma && exec rs3
    volumes:
      - ${PWD}/storage/rs3:/var/lib/rs3/data
    healthcheck:
      test: ["CMD-SHELL", "rs3-cli ls s3://sigma >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
networks:
  default:
    name: ${DOCKER_NETWORK:-sigma}
