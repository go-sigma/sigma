{{- if .Values.rs3.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sigma.rs3" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "sigma.labels" . | nindent 4 }}
    app.kubernetes.io/component: rs3
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: {{ .Values.rs3.service.port }}
      targetPort: s3
      protocol: TCP
  selector:
    {{- include "sigma.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rs3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sigma.rs3.headless" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "sigma.labels" . | nindent 4 }}
    app.kubernetes.io/component: rs3
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: s3
      port: {{ .Values.rs3.service.port }}
      targetPort: s3
      protocol: TCP
  selector:
    {{- include "sigma.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rs3
{{- end }}
