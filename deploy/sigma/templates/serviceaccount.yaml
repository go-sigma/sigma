{{- if and .Values.config.daemon.builder.enabled ( eq .Values.config.daemon.builder.type "kubernetes" ) }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "sigma.fullname" . | quote }}
  namespace: {{ .Values.config.daemon.builder.kubernetes.namespace | quote }}
  labels:
    {{- include "sigma.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- . | toYaml | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- .Values.commonAnnotations | toYaml | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - pods/finalizers
    verbs:
      - update
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "sigma.fullname" . | quote }}
  namespace: {{ .Values.config.daemon.builder.kubernetes.namespace | quote }}
  labels:
    {{- include "sigma.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- . | toYaml | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- .Values.commonAnnotations | toYaml | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sigma.fullname" . | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sigma.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sigma.serviceAccountName" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "sigma.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- . | toYaml | nindent 4 }}
    {{- end }}
  {{- if or .Values.serviceAccount.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- . | toYaml | nindent 4 }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- . | toYaml | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
